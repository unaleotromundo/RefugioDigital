<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Conversar | Conexión</title>
    <link rel="icon" type="image/png" href="../cosas%20a%20revisar/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../site-style.css">
</head>
<body class="chat-page">
    
    <div id="particle-container"></div>

    <!-- PANEL LATERAL DE HISTORIAL -->
    <div id="history-sidebar" class="fixed top-0 left-0 h-full w-80 bg-white/95 dark:bg-slate-900/95 backdrop-blur-xl z-50 transform -translate-x-full transition-transform duration-300 border-r border-amber-500/20 shadow-2xl">
        <div class="p-6 flex flex-col h-full">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-amber-600 font-black uppercase tracking-widest text-sm">Conversaciones guardadas</h2>
                <button onclick="toggleHistory(false)" class="text-slate-400 hover:text-amber-600 text-3xl" aria-label="Cerrar historial">&times;</button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto space-y-3 pr-2">
                <!-- Chats guardados dinámicamente -->
            </div>
        </div>
    </div>

    <aside id="sidebar" class="sidebar">
        <div class="sidebar-logo">
            <a href="../index.html" class="flex items-center gap-3 group">
                <img src="../cosas%20a%20revisar/logo.png" alt="" class="w-12 h-12 object-contain">
                <div class="flex flex-col items-start">
                    <span class="text-lg font-black tracking-tighter text-amber-600 leading-tight">CONEXIÓN</span>
                    <span class="text-xs font-semibold tracking-wide text-slate-900 dark:text-white leading-tight">un espacio compartido</span>
                </div>
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="../crisis.html" class="sidebar-link text-red-600 hover:text-red-600">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9 2.8 17a2 2 0 0 0 1.7 3h15a2 2 0 0 0 1.7-3l-7.5-13.1a2 2 0 0 0-3.4 0Z"/></svg>
                <span>Si necesitás ayuda</span>
            </a>
            <a href="../recomendaciones.html" class="sidebar-link text-slate-700 dark:text-slate-300">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/><path d="m19 14 .9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9L19 14Z"/></svg>
                <span>Lecturas y hallazgos</span>
            </a>
            <a href="index.html" class="sidebar-link active" aria-current="page">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-4 2v-5.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01"/></svg>
                <span>Conversar</span>
            </a>
            <a href="../refugio.html" class="sidebar-link text-slate-700 dark:text-slate-300">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>
                <span>Compartir</span>
            </a>
            <a href="../reflexiones.html" class="sidebar-link text-slate-700 dark:text-slate-300">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 4.5A2.5 2.5 0 0 1 7.5 2H20v17H7.5A2.5 2.5 0 0 0 5 21.5v-17Z"/><path d="M5 18.5A2.5 2.5 0 0 1 7.5 16H20M9 7h7m-7 4h7"/></svg>
                <span>Voces</span>
            </a>
        </nav>
        <div class="sidebar-controls">
            <button onclick="toggleMusic()" id="music-btn-sidebar" class="flex-1 p-3 rounded-xl bg-amber-500/10 text-amber-600 dark:text-amber-400 hover:bg-amber-500/20 transition">
                <svg id="speaker-icon-sidebar" class="w-6 h-6 mx-auto" fill="currentColor" viewBox="0 0 24 24"></svg>
            </button>
            <button onclick="toggleDarkMode()" class="flex-1 p-3 rounded-xl bg-amber-500/10 text-amber-600 dark:text-amber-400 hover:bg-amber-500/20 transition" aria-label="Cambiar tema" title="Cambiar tema">
                <svg class="w-6 h-6 mx-auto" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
                </svg>
            </button>
        </div>
    </aside>

    <div class="mobile-header">
        <a href="../index.html" class="flex items-center gap-2">
            <img src="../cosas%20a%20revisar/logo.png" alt="" class="w-8 h-8 object-contain">
            <span class="text-lg font-black tracking-tighter text-amber-600">Conexión</span>
        </a>
        <div class="flex items-center gap-2">
            <button onclick="toggleMusic()" class="p-3 rounded-full bg-amber-500/10 text-amber-700 dark:text-amber-500 border border-amber-500/20 hover:scale-110 transition-all" aria-label="Activar o pausar música" title="Activar o pausar música">
                <svg id="speaker-icon" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                </svg>
            </button>
            <button onclick="toggleDarkMode()" class="p-2 rounded-full bg-amber-500/10 text-amber-600" aria-label="Cambiar tema" title="Cambiar tema">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
                </svg>
            </button>
            <button onclick="toggleSidebar()" class="p-2 rounded-full bg-amber-600 text-white" aria-label="Abrir menú">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="chat-layout">
      <main class="relative z-10">
        <!-- BOTONES DE CONTROL DE SESIÓN -->
        <div class="flex gap-3 mb-4 w-full max-w-3xl mx-auto">
            <button onclick="createNewChat()" class="chat-session-button chat-session-primary flex-1 bg-amber-600 text-white py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-amber-700 transition-all shadow-lg">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                <span>Empezar de nuevo</span>
            </button>
            <button onclick="toggleHistory(true)" class="chat-session-button flex-1 bg-white/80 dark:bg-slate-800/80 border border-amber-500/20 py-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:border-amber-500 transition-all shadow-sm dark:text-white">
                <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                <span>Historial</span>
            </button>
        </div>

        <!-- MARCO DEL CHAT -->
        <div class="chat-frame">
            <div class="chat-container" id="chat-box">
                <!-- Mensajes -->
            </div>
        </div>

        <!-- ENTRADA DE TEXTO -->
        <div class="mt-4 mb-2 relative w-full max-w-4xl mx-auto">
            <textarea
                   id="chat-input" 
                   rows="2"
                   placeholder="¿Qué te gustaría poner en palabras?" 
                   class="w-full p-5 pr-16 rounded-2xl text-lg italic shadow-xl resize-y"></textarea>
            
            <button id="send-btn" class="absolute right-2 top-1/2 -translate-y-1/2 bg-amber-600 text-white p-3.5 rounded-xl hover:bg-amber-700 transition-all" aria-label="Enviar mensaje" title="Enviar mensaje">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19V5m-7 7 7-7 7 7"></path>
                </svg>
            </button>
        </div>
        <p class="text-center text-xs text-slate-500 dark:text-slate-400">La conversación se guarda en tu historial. Evitá incluir datos que te identifiquen.</p>
      </main>
    </div>

    <script>
        // Gestión de Tema
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Motor de Partículas Cayendo
        const container = document.getElementById('particle-container');
        function createParticle() {
            const p = document.createElement('div');
            const size = Math.random() * 4 + 2;
            const duration = Math.random() * 12 + 8;
            p.className = 'particle';
            p.style.width = `${size}px`; 
            p.style.height = `${size}px`;
            p.style.left = `${Math.random() * 100}%`;
            p.style.setProperty('--duration', `${duration}s`);
            p.style.setProperty('--opacity', Math.random() * 0.3 + 0.2);
            container.appendChild(p);
            setTimeout(() => p.remove(), duration * 1000);
        }
        setInterval(createParticle, 600);
    </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
    <!-- SCRIPT DE MÚSICA PERSISTENTE -->
    <script src="../music-player.js"></script>
</body>
</html>
